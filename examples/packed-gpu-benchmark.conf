# Long-running GPU A/B benchmark: 200,000 x 200,000 columns x 61 Y values
# equals 2.44 trillion candidate positions. On the development RTX 5080
# Laptop GPU this runs long enough that initialization/readback do not dominate.
algorithm = Vanilla-3
scanOrder = linear
directions = [0]
xRange = (-200000, 200000)
yRange = (-60, 1)
zRange = (-200000, 200000)
errorTolerance = 0
cpuTileSize = (1024, 1024)
gpuTileSize = (8192, 8192)
verbose = false

[filter]
-1 0 -2 | 0
0 0 -2 | 2
-3 0 -1 | 3
-2 0 -1 | 2
-1 0 -1 | 2
0 0 -1 | 2
-3 0 0 | 2
-2 0 0 | 0
0 0 0 | 1
-3 0 1 | 0
-2 0 1 | 0
0 0 1 | 3
0 0 2 | 1
0 0 3 | 0
1 1 -3 | 2
1 1 -2 | 1
-4 1 -1 | 0
1 1 -1 | 2
-4 1 0 | 0
1 1 0 | 1
2 1 0 | 0
-4 1 1 | 1
1 1 1 | 3
2 1 1 | 0
2 1 2 | 2
2 1 3 | 3
2 1 4 | 2
2 1 5 | 3
