algorithm = Vanilla-3
scanOrder = linear
directions = [0]

xRange = (-1, 1)
yRange = (0, 1)
zRange = (-1, 1)
errorTolerance = 0

cpuTileSize = (1, 1)
gpuTileSize = (1, 1)
verbose = false

[filter]
# The three faces together identify netherrack model index 5.
0 0 0 | 1 netherrack-up
0 0 0 | 3 netherrack-north
0 0 0 | 2 netherrack-east
