# Copy this file to coordsfinder.conf for local runs.
# coordsfinder.conf is ignored by Git.

mode = Vanilla-3

xStart = -5000
xEnd = 5000
yStart = -60
yEnd = 0
zStart = -5000
zEnd = 5000

chunkBlocksX = 16384
chunkBlocksZ = 64
maxBadBlocks = 0
printChunks = true

[filter]
# x y z | rotation [side]
# (353, -60, -53)
-1 0 0 | 3
-2 0 0 | 1
-3 0 0 | 2
-4 0 0 | 0
-1 0 1 | 0
-2 0 1 | 0
-3 0 1 | 1
-4 0 1 | 0
0 0 0 | 0 side
1 0 0 | 0 side
2 0 0 | 0 side
3 0 0 | 1 side
0 1 0 | 0 side
1 1 0 | 1 side
2 1 0 | 0 side
3 1 0 | 0 side
0 2 0 | 0 side
1 2 0 | 1 side
2 2 0 | 0 side
3 2 0 | 1 side
0 3 0 | 0 side
1 3 0 | 1 side
2 3 0 | 1 side
3 3 0 | 1 side
